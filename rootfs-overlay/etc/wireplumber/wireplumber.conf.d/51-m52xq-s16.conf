# M52XQ (Debian + PipeWire): open the ALSA outputs AND inputs in S16LE / 48 kHz.
# With the default S24_LE the speaker (TFA9878 on QUIN MI2S) stays silent although the PCM runs and DAPM is on;
# with S16_LE it plays (checked on the phone 2026-11-13: rule off -> silent, rule on -> sound). PulseAudio on pmOS used S16 too.
# 2026-11-19: the microphone too (it was opened as s24-32le: in Telegram calls the other side heard noise instead of the voice).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" }, { node.name = "~alsa_input.*" } ]
    actions = { update-props = { audio.format = "S16LE", audio.rate = 48000 } }
  }
]
