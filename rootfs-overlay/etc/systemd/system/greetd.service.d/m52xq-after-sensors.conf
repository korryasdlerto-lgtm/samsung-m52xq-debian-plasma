# M52XQ (Debian Plasma): start the Plasma Mobile session (greetd autologin) only once the accelerometer streams.
# iio-sensor-proxy itself starts at once, but the SSC sensors of the ADSP come ~20 s later; KWin/plasmashell that
# start before see HasAccelerometer=false: no auto-rotation, no "Auto Rotate" tile, no automatic brightness
# (2026-11-14). m52xq-sensor-kick waits until the accelerometer streams (or gives up) and finishes then.
# (pm-Plasma: the same for plasma-mobile.service, see the comment of its m52xq-after-sensors.conf)
[Unit]
Wants=iio-sensor-proxy.service m52xq-sensor-kick.service
After=iio-sensor-proxy.service m52xq-sensor-kick.service
