[Service]
# M52XQ: plasmashell asks PowerDevil for screen brightness only once at start.
# Wait (max 15 s) until PowerDevil is on the session bus, so the shade brightness
# slider is always there. No After=/Wants=: plasma-powerdevil is After=plasma-core.target,
# which already waits for plasmashell (ordering cycle -> plasmashell job dropped).
ExecStartPre=/bin/sh -c 'i=0; while [ $$i -lt 30 ]; do busctl --user status org.kde.Solid.PowerManagement >/dev/null 2>&1 && exit 0; i=$$((i+1)); sleep 0.5; done; exit 0'
